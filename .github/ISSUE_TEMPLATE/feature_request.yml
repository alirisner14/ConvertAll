name: Feature request
description: Suggest a new conversion, option or improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task, not the solution - it often has a simpler answer.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like ConvertAll to do?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which area?
      options:
        - Conversion
        - Tracing (Raster to Vector)
        - Split SVG Layers
        - Compression
        - Accessibility
        - Something new
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle it today?
      description: Another tool, a script, or doing it by hand - all useful to know.
