[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "convertall"
dynamic = ["version"]
description = "Batch-convert images (includes vector art), audio, and video, with tracing, SVG splitting and visually lossless compression."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["converter", "webp", "heic", "ico", "svg", "potrace", "ffmpeg", "accessibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
]
dependencies = [
    "customtkinter>=5.2.2",
    "Pillow>=11.0.0",
    "pillow-heif>=0.18.0",
    "imageio-ffmpeg>=0.5.1",
    "potracer>=0.0.4",
    "numpy>=1.26.0",
    "lxml>=5.2.0",
]

[project.optional-dependencies]
dnd = ["tkinterdnd2>=0.4.2"]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "ruff>=0.6.0", "build>=1.2.0", "pyinstaller>=6.6.0"]

[project.gui-scripts]
convertall = "convertall.__main__:main"

[project.urls]
Homepage = "https://github.com/alirisner14/ConvertAll"
Issues = "https://github.com/alirisner14/ConvertAll/issues"
Changelog = "https://github.com/alirisner14/ConvertAll/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["convertall", "convertall.core"]

[tool.setuptools.dynamic]
version = { attr = "convertall.__version__" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E731",  # lambda assignment is deliberate in the job runner
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Put the project root on sys.path so `pytest` works straight from a clone,
# with no editable install. Without this only `python -m pytest` works, because
# that form alone adds the working directory to sys.path.
pythonpath = ["."]
